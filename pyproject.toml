[project]
name = "so-tactile"
version = "0.1.0"
description = "Tactile sensing utilities for SO-ARM experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flexitac[examples]>=0.3.1",
    "lerobot[feetech] @ git+https://github.com/TNA001-AI/lerobot_tactile.git",
]

[project.scripts]
so-tactile = "so_tactile.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so_tactile"]

[tool.hatch.metadata]
allow-direct-references = true
